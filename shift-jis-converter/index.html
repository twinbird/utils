<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UTF-8からShift_JISへ変換</title>
    <meta
      name="description"
      content="UTF-8のテキストファイルをブラウザー内でShift_JISへ変換してダウンロードできます。"
    />
    <link rel="stylesheet" href="app.css" />
    <script src="shift-jis-map.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>UTF-8からShift_JISへ変換</h1>
      <p>
        UTF-8のテキストファイルを選ぶと、Shift_JISに変換してダウンロードできます。
      </p>

      <label for="source-file">UTF-8ファイル</label>
      <input id="source-file" type="file" />

      <div class="button-row">
        <button id="convert-btn" type="button" disabled>
          変換してダウンロード
        </button>
      </div>

      <p id="status-message" class="status-message" aria-live="polite"></p>
      <p class="note">
        日本語Windowsで一般的なCP932（Windows-31J）で変換します。CP932に含まれない文字がある場合は変換できません。ファイルの内容はサーバーへ送信されません。
      </p>
      <p>
        <a href="../shift-jis-to-utf8/">Shift_JIS（CP932）からUTF-8へ変換</a>
      </p>
    </main>
  </body>
</html>
