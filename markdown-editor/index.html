<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>マークダウンエディタ</title>
    <meta
      name="description"
      content="ブラウザー内でMarkdownを編集し、リアルタイムにプレビューできるエディタ。ファイルはサーバーへ送信されません。"
    />
    <link rel="stylesheet" href="app.css" />
    <script src="vendor/marked.umd.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>マークダウンエディタ</h1>

      <div id="drop-area" class="editor-area">
        <div class="area-toolbar">
          <div class="icon-toolbar">
            <button
              id="open-btn"
              type="button"
              class="icon-button"
              title="ファイルを開く"
              aria-label="ファイルを開く"
            >
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"
                />
              </svg>
            </button>
            <button
              id="new-btn"
              type="button"
              class="icon-button"
              title="新規作成（現在の内容を消す）"
              aria-label="新規作成（現在の内容を消す）"
            >
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M6 3h8l4 4v14H6z" />
                <path d="M14 3v4h4" />
                <path d="M12 12v6" />
                <path d="M9 15h6" />
              </svg>
            </button>
            <button
              id="save-btn"
              type="button"
              class="icon-button"
              title="保存（ダウンロード）"
              aria-label="保存（ダウンロード）"
            >
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 4v11" />
                <path d="M7 11l5 5 5-5" />
                <path d="M5 20h14" />
              </svg>
            </button>
          </div>
          <span id="file-name" class="file-name"></span>
        </div>

        <div class="panes">
          <textarea
            id="editor"
            placeholder="ここにMarkdownを書きます"
            spellcheck="false"
          ></textarea>
          <div id="preview" class="preview"></div>
        </div>

        <input
          id="source-file"
          type="file"
          accept=".md,.markdown,.txt"
          hidden
        />
      </div>

      <p id="status-message" class="status-message" aria-live="polite"></p>

      <div id="save-modal" class="modal-backdrop" hidden>
        <div
          class="modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="save-modal-title"
        >
          <h2 id="save-modal-title">保存</h2>

          <label for="save-filename">
            ファイル名
            <input id="save-filename" type="text" />
          </label>
          <label for="save-format">
            形式
            <select id="save-format">
              <option value="markdown" selected>Markdown</option>
              <option value="html">HTML</option>
            </select>
          </label>

          <div class="modal-actions">
            <button id="save-cancel-btn" type="button" class="button-secondary">
              キャンセル
            </button>
            <button id="save-confirm-btn" type="button">ダウンロード</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
