<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HEICからJPEGへ変換</title>
    <meta
      name="description"
      content="HEIC/HEIF画像をブラウザ内でJPEGに変換するツールです。画像はサーバーへ送信されません。"
    />
    <link rel="stylesheet" href="app.css" />
    <script src="vendor/heic-to.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>HEICからJPEGへ変換</h1>
      <p class="description">
        HEIC/HEIF画像をJPEGに変換します。変換はブラウザ内で行われ、画像はサーバーへ送信されません。
      </p>

      <label id="drop-area" class="drop-area" for="file-input">
        <span class="drop-title"
          >HEIC画像を選択、またはここへドラッグ＆ドロップ</span
        >
        <span class="drop-hint">複数の画像をまとめて選択できます</span>
        <input
          id="file-input"
          type="file"
          accept=".heic,.heif,image/heic,image/heif"
          multiple
        />
      </label>

      <div class="controls">
        <label for="quality-input"
          >JPEG品質
          <output id="quality-value" for="quality-input">90%</output></label
        >
        <input id="quality-input" type="range" min="10" max="100" value="90" />
        <button id="convert-button" type="button" disabled>JPEGへ変換</button>
      </div>

      <p id="status-message" class="status-message" aria-live="polite"></p>
      <ul id="file-list" class="file-list" aria-live="polite"></ul>
      <p class="note">
        変換後のJPEGには元画像の撮影情報などのメタデータは引き継がれません。
      </p>
    </main>
  </body>
</html>
